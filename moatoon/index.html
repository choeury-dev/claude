<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>모아툰 작업실</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=Black+Han+Sans&family=Do+Hyeon&family=Jua&family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;700&family=Nanum+Gothic:wght@400;700&family=Nanum+Pen+Script&family=Gaegu:wght@400;700&family=Hi+Melody&family=Gamja+Flower&family=Poor+Story&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ───────── 첫 화면: 드라이브 ───────── -->
<div id="home" class="home" hidden>
  <header class="home-top">
    <div class="brand"><span class="logo" aria-hidden="true">모아</span><div><b>모아툰 작업실</b><small>회차 드라이브</small></div></div>
    <label class="search"><span class="sr-only">회차 검색</span><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="6"/><path d="M13.5 13.5 18 18"/></svg><input id="home-search" placeholder="회차 이름 검색"></label>
    <div class="home-top-actions">
      <button id="btn-home-import" class="btn dark">스크립트 파일 열기</button>
      <button id="btn-home-new" class="btn accent">새 회차 만들기</button>
    </div>
  </header>
  <div class="home-body">
    <nav class="home-rail" aria-label="메뉴">
      <button class="rail-btn on" data-home="drive"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/></svg>프로젝트</button>
      <button class="rail-btn" data-home="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>연결 설정</button>
    </nav>
    <aside class="home-side">
      <button class="side-link on" data-src="local"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 15h18"/></svg>내 드라이브 <small>이 브라우저</small></button>
      <button class="side-link" data-src="google"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3h8l6 10-4 7H6l-4-7z"/></svg>Google 드라이브</button>
      <button class="side-link" data-src="layouts"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="8" height="8"/><rect x="13" y="3" width="8" height="8"/><rect x="3" y="13" width="18" height="8"/></svg>레이아웃 보관함</button>
    </aside>
    <main class="home-main" id="home-main">
      <section class="banner">
        <div>
          <h1>오늘은 어떤 회차를 만들어볼까요?</h1>
          <div class="banner-actions">
            <button class="pill" data-act="new">새 회차 만들기</button>
            <button class="pill" data-act="google">Google 드라이브에서 회차 고르기</button>
          </div>
        </div>
        <svg class="banner-art" viewBox="0 0 220 130" aria-hidden="true"><rect x="10" y="10" width="95" height="52" rx="4"/><rect x="115" y="10" width="95" height="52" rx="4"/><rect x="10" y="70" width="95" height="52" rx="4"/><rect x="115" y="70" width="95" height="52" rx="4"/><ellipse cx="60" cy="32" rx="30" ry="12"/><path d="M52 43 46 52 62 44"/></svg>
      </section>
      <div id="home-content"></div>
    </main>
  </div>
</div>

<!-- ───────── 편집 화면 ───────── -->
<div id="editor" class="editor" hidden>
  <header class="ed-top">
    <button id="btn-home" class="icon-btn" title="드라이브로" aria-label="드라이브로 돌아가기"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <span class="ed-brand"><span class="logo sm" aria-hidden="true">모아</span>모아툰 작업실</span>
    <span class="sep"></span>
    <button id="btn-undo" class="icon-btn" title="실행 취소 (Ctrl+Z)" aria-label="실행 취소"><svg viewBox="0 0 24 24"><path d="M9 7 4 12l5 5"/><path d="M4 12h10a6 6 0 0 1 0 12h-2"/></svg></button>
    <button id="btn-redo" class="icon-btn" title="다시 실행 (Ctrl+Shift+Z)" aria-label="다시 실행"><svg viewBox="0 0 24 24"><path d="m15 7 5 5-5 5"/><path d="M20 12H10a6 6 0 0 0 0 12h2"/></svg></button>
    <span id="save-state" class="save-state" title="저장 상태"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 18a5 5 0 1 1 1-9.9A6 6 0 0 1 19 10a4 4 0 0 1-1 8z"/></svg><span>저장됨</span></span>
    <div class="ed-title">
      <label class="sr-only" for="ep-name">회차 이름</label>
      <input id="ep-name" maxlength="60">
      <button id="btn-size" class="chip-btn" title="캔버스 크기 설정"></button>
    </div>
    <div class="ed-actions">
      <button id="btn-drive-save" class="btn dark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3h8l6 10-4 7H6l-4-7z"/></svg>드라이브에 저장</button>
      <button id="btn-export" class="btn accent"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>다운로드</button>
    </div>
  </header>
  <div class="ed-body">
    <nav class="rail" aria-label="도구">
      <button class="rail-btn" data-tab="script"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M9 11h7M9 15h7M9 7h4"/></svg>스크립트</button>
      <button class="rail-btn" data-tab="layout"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 10h18M12 10v11"/></svg>레이아웃</button>
      <button class="rail-btn" data-tab="elements"><svg viewBox="0 0 24 24"><circle cx="7" cy="7" r="3.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><path d="M7 13.5 3.5 20.5h7z"/><circle cx="17" cy="17" r="3.5"/></svg>요소</button>
      <button class="rail-btn" data-tab="text"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 8h8M12 8v9"/></svg>텍스트</button>
      <button class="rail-btn" data-tab="upload"><svg viewBox="0 0 24 24"><path d="M7 18a5 5 0 1 1 1-9.9A6 6 0 0 1 19 10a4 4 0 0 1-1 8"/><path d="M12 12v8M9 15l3-3 3 3"/></svg>업로드</button>
      <button class="rail-btn" data-tab="background"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="m3 15 5-5 4 4 3-3 6 6"/></svg>배경</button>
      <button class="rail-btn" data-tab="guide"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/><path d="m9 10 2 2 4-4"/></svg>대사 가이드</button>
      <button class="rail-btn" data-tab="ai"><svg viewBox="0 0 24 24"><path d="m12 3 1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg>AI 활용</button>
      <button class="rail-btn" data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>설정</button>
      <button id="btn-side-toggle" class="rail-btn rail-bottom" title="패널 접기" aria-label="패널 접기"><svg viewBox="0 0 24 24"><path d="m14 6-6 6 6 6M20 6l-6 6 6 6"/></svg></button>
    </nav>
    <aside id="side" class="side" aria-live="polite"></aside>
    <main id="canvas-area" class="canvas-area">
      <div id="pages" class="pages"></div>
      <div id="toolbar" class="toolbar" hidden></div>
      <textarea id="inline-edit" class="inline-edit" hidden aria-label="글 바로 고치기"></textarea>
    </main>
    <aside id="layers" class="layers" aria-label="레이어"></aside>
  </div>
  <footer class="ed-bottom">
    <label class="toggle"><input id="toggle-guides" type="checkbox" checked><span>가이드 표시</span></label>
    <span id="page-indicator" class="muted"></span>
    <span class="grow"></span>
    <button id="btn-layers" class="icon-btn" title="레이어 패널" aria-label="레이어 패널 열고 닫기"><svg viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/></svg></button>
    <button id="zoom-out" class="icon-btn" aria-label="축소"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
    <button id="zoom-fit" class="zoom-val" title="화면에 맞추기"></button>
    <button id="zoom-in" class="icon-btn" aria-label="확대"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></svg></button>
  </footer>
</div>

<!-- 공용 창 -->
<div id="modal" class="modal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-head"><h2 id="modal-title"></h2><button class="icon-btn" data-close aria-label="닫기"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <div id="modal-body" class="modal-body"></div>
  </div>
</div>
<input id="file-script" type="file" accept=".txt,.md,.json,text/plain,application/json" hidden>
<input id="file-image" type="file" accept="image/*" multiple hidden>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
